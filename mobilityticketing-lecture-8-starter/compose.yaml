name: mobility-l08
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mobility_l08
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility_l08"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - labdata:/var/lib/postgresql/data
      - .:/lab:ro
volumes:
  labdata:
